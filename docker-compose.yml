version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SQLITE_PATH=/data/waitlist.db
      - DATABASE_URL=mysql://seatix_user:seatix_password@mysql:3306/seatix_waitlist
      - DATABASE_HOST=mysql
      - DATABASE_USER=seatix_user
      - DATABASE_PASSWORD=seatix_password
      - DATABASE_NAME=seatix_waitlist
    depends_on:
      - redis
      - mysql
    volumes:
      - ./data:/data

  redis:
    image: redis:7
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1000 --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=seatix_waitlist
      - MYSQL_USER=seatix_user
      - MYSQL_PASSWORD=seatix_password
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  redis-data:
  mysql-data:
